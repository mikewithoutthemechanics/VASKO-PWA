<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="VASKO Sales and Marketing System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VASKO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">◆</span>
          <span class="brand-text">VASKO</span>
        </div>
        <div class="tagline">Sales & Marketing System</div>
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="text" id="search-input" placeholder="Search content..." autocomplete="off">
          <kbd class="search-kbd">⌘K</kbd>
        </div>
      </div>
      <nav class="section-list" id="section-list"></nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <div class="topbar">
        <button class="menu-btn" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
        <div class="topbar-breadcrumb" id="topbar-breadcrumb">
          <span class="breadcrumb-item">Brand</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="bookmark-btn" title="Bookmark current page">☆</button>
          <button class="icon-btn" id="config-btn" title="Configure app">⚙️</button>
        </div>
      </div>
      <div class="content-area">
        <aside class="file-sidebar">
          <div class="file-list-header" id="file-list-header">
            <span>Files</span>
            <span class="file-count" id="file-count">0</span>
          </div>
          <div class="file-list-search" id="file-list-search">
            <input type="text" placeholder="Filter files...">
          </div>
          <div id="file-list"></div>
        </aside>
        <article class="content" id="content">
          <div class="loading-state" id="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
          </div>
          <div class="error-state" id="error-state" style="display: none;">
            <h2>Something went wrong</h2>
            <p id="error-message"></p>
            <button class="retry-btn" onclick="loadFiles(currentPath)">Retry</button>
          </div>
        </article>
      </div>
    </main>
  </div>

  <div class="search-modal" id="search-modal">
    <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
    <div class="search-modal-content">
      <div class="search-modal-input-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="modal-search-input" placeholder="Search all content..." autocomplete="off">
        <kbd class="search-kbd">ESC</kbd>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="config-modal" id="config-modal">
    <div class="config-modal-backdrop" id="config-modal-backdrop"></div>
    <div class="config-modal-content">
      <div class="config-modal-header">
        <h2>Configure App</h2>
        <button class="config-close" id="config-close">×</button>
      </div>
      <div class="config-modal-body">
        <div class="config-section">
          <h3>Brand</h3>
          <div class="config-grid">
            <label>Brand Name<input type="text" id="config-brand-name"></label>
            <label>Tagline<input type="text" id="config-tagline"></label>
            <label>Product Name<input type="text" id="config-product-name"></label>
            <label>Accent Color<input type="color" id="config-accent-color" value="#38bdf8"></label>
            <label>Icon (emoji)<input type="text" id="config-icon" maxlength="2"></label>
          </div>
        </div>
        <div class="config-section">
          <h3>Pricing</h3>
          <div class="config-grid">
            <label>Currency<input type="text" id="config-currency" placeholder="USD"></label>
            <label>Symbol<input type="text" id="config-symbol" placeholder="$"></label>
          </div>
          <div id="config-pricing-list"></div>
          <button class="config-add-tier" id="config-add-tier">+ Add Tier</button>
        </div>
        <div class="config-section">
          <h3>Sections</h3>
          <div id="config-sections-list"></div>
        </div>
        <div class="config-section">
          <h3>Repository</h3>
          <div class="config-grid">
            <label>Repo Owner<input type="text" id="config-repo-owner"></label>
            <label>Repo Name<input type="text" id="config-repo-name"></label>
            <label>Branch<input type="text" id="config-repo-branch"></label>
          </div>
        </div>
        <div class="config-section">
          <h3>Contact</h3>
          <div class="config-grid">
            <label>Email<input type="email" id="config-email"></label>
            <label>Phone<input type="tel" id="config-phone"></label>
            <label>Website<input type="url" id="config-website"></label>
          </div>
        </div>
      </div>
      <div class="config-modal-footer">
        <button class="config-btn config-btn-secondary" id="config-export">Export Config</button>
        <button class="config-btn config-btn-secondary" id="config-import">Import Config</button>
        <button class="config-btn config-btn-danger" id="config-reset">Reset</button>
        <button class="config-btn config-btn-primary" id="config-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
